name: Website uptime
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: website-uptime
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public API and database-backed content
        run: |
          node --input-type=module <<'JS'
          for (const path of ['/api/health', '/api/cms']) {
            const response = await fetch('https://www.vijayaengineeringworks.com' + path, { signal: AbortSignal.timeout(20000), cache: 'no-store' });
            if (!response.ok) throw new Error(path + ' returned ' + response.status);
            const data = await response.json();
            if (path === '/api/health' ? data.status !== 'ok' : !data.cms) throw new Error(path + ' returned an unexpected response');
            console.log(path + ': OK');
          }
          JS
